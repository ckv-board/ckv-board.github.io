function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function op(pw){var bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.salt),iterations:P.iter,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.iv)},key,u(P.ct));return new TextDecoder().decode(pt)}
async function go(pw,auto){var er=document.getElementById('er');er.textContent=auto?'':'여는 중...';try{var h=await op(pw);if(document.getElementById('rm')&&document.getElementById('rm').checked)localStorage.setItem('ckv_pw',pw);document.open();document.write(h);document.close()}catch(e){if(auto){localStorage.removeItem('ckv_pw');return}er.textContent=(window.crypto&&crypto.subtle)?'비밀번호가 맞지 않아요.':'이 브라우저에서는 열 수 없어요(https 주소로 열어주세요).'}}
document.getElementById('f').onsubmit=function(e){e.preventDefault();go(document.getElementById('pw').value)};
var s=localStorage.getItem('ckv_pw');if(s){document.getElementById('rm').checked=true;go(s,true)}
</script></body></html>
